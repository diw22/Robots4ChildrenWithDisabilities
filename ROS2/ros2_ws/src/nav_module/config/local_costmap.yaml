local_costmap:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    update_frequency: 5.0
    publish_frequency: 2.0
    width: 3.0
    height: 3.0
    resolution: 0.05
    rolling_window: true
    use_sim_time: false

    plugins:
      - {name: obstacle_layer, type: "nav2_costmap_2d::ObstacleLayer"}
      - {name: inflation_layer, type: "nav2_costmap_2d::InflationLayer"}

    obstacle_layer:
      enabled: true
      observation_sources: scan
      scan:
        topic: scan
        sensor_frame: laser
        data_type: LaserScan
        clearing: true
        marking: true

    inflation_layer:
      enabled: true
      inflation_radius: 0.5
