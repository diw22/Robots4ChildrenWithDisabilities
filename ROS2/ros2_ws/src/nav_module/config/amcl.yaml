amcl:
  ros__parameters:
    use_map_topic: false
    first_map_only: false
    base_frame_id: base_link
    odom_frame_id: odom
    scan_topic: scan
    min_particles: 500
    max_particles: 2000
    alpha1: 0.3
    alpha2: 0.3
    alpha3: 0.3
    alpha4: 0.3
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    transform_tolerance: 0.2
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    tf_broadcast: true
    queue_size: 20
    use_lifecycle_node: true
