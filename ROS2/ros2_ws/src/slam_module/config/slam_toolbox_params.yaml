slam_toolbox:
  ros__parameters:
    use_sim_time: false
    slam_mode: true
    resolution: 0.05
    map_update_interval: 1.0          # Update map more frequently (default is 2.0)
    publish_period: 0.05              # Map publishing rate
    transform_publish_period: 0.05    # TF broadcasting rate
    map_file_name: "map"
    scan_topic: /scan
    odom_frame: odom
    base_frame: base_link
    map_frame: map
    publish_map_tf: true
    use_scan_matching: true           # Enable scan matching for better alignment

    use_scan_barycenter: true         # Use scan barycenter for better registration
    minimum_travel_distance: 0.05     # Update SLAM even with small linear motion (meters)
    minimum_travel_heading: 0.017     # Update SLAM with small angular motion (~1 degree in radians)
    max_laser_range: 8.0              # Maximum usable lidar range (adjust if needed)
    scan_buffer_size: 10              # Number of scans to keep in buffer for matching
    scan_buffer_maximum_scan_distance: 2.0  # Max distance between scans to consider for registration
    link_match_minimum_response_fine: 0.1   # Minimum correlation score for scan match
    do_loop_closing: true             # Enable loop closure (adjusts drift after returning to known place)
    loop_match_maximum_variance_coarse: 3.0
    loop_search_maximum_distance: 3.0
