slam_toolbox:
  ros__parameters:
    use_sim_time: false
    slam_mode: true
    resolution: 0.05
    map_update_interval: 2.0
    publish_period: 0.05
    transform_publish_period: 0.05
    map_file_name: "map"
    scan_topic: /scan
    odom_frame: odom
    base_frame: base_link
    map_frame: map
    publish_map_tf: true
    use_scan_matching: true
